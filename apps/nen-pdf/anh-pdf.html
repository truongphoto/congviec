<html lang="vi">

<title>GPP Ảnh → PDF</title>

<style>

*{box-sizing:border-box}html,body{height:100%}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:transparent;color:var(--text);overflow:hidden}

.head{display:flex;align-items:center;justify-content:space-between;gap:12px}.title{font-size:1.35rem;font-weight:850}.badge{font-size:.78rem;color:#166534;background:#f0fdf4;padding:7px 10px;border-radius:999px;font-weight:750}

<body>
<div class="page"><section class="app">
  <div id="drop" class="drop">

  <div class="controls">

    <div class="field"><label>Lề trang</label><select id="margin"><option value="24">Vừa</option><option value="12">Nhỏ</option><option value="0">Không lề</option></select></div>
    <button id="single" class="btn single" disabled>Xuất từng file PDF</button>
    <button id="merged" class="btn merged" disabled>Xuất gộp PDF</button>
  </div>
  <div id="status" class="status"></div>
</section></div>

<div id="modal" class="modal" hidden>
  <div class="dialog">
    <div class="mhead"><h3></h3><button id="close" class="close">✕</button></div>
    <div class="toptools">

      <button id="auto" class="topbtn auto">Auto</button>

        <input id="cleanRange" type="range" min="0" max="100" step="1" value="0">
      </div>
      <div class="toolbar-range">
        <div class="toolbar-range-head"><span>Độ rõ chữ</span><span id="clarityVal" class="whiteval">0%</span></div>
        <input id="clarityRange" type="range" min="0" max="100" step="1" value="0">
      </div>
      <button id="save" class="topbtn save">Lưu</button>
    </div>
    <div class="layout">
      <div class="pane">
        <div class="pane-title">Ảnh gốc</div>
        <div id="editorWrap" class="canvaswrap"><canvas id="editor"></canvas></div>
        <div id="state" class="state"></div>
      </div>
      <div class="pane">
        <div class="pane-title">Sau cân</div>
        <div id="previewWrap" class="canvaswrap"><canvas id="preview"></canvas></div>
      </div>
    </div>
  </div>
</div>
<script>

const fmt=b=>b<1048576?(b/1024).toFixed(1)+' KB':(b/1048576).toFixed(2)+' MB';

function sync(){single.disabled=merged.disabled=busy||!items.length;choose.disabled=busy}
function revokeItem(i){if(i.thumbUrl)URL.revokeObjectURL(i.thumbUrl)}
async function makeThumb(file){

async function addFiles(fs){const arr=Array.from(fs||[]).filter(f=>A.has(f.type)||/\.(jpe?g|png|webp)$/i.test(f.name));if(!arr.length)return setStatus('Không có ảnh hợp lệ.',true);busy=true;sync();try{for(let n=0;n<arr.length;n++){setStatus(`Đang thêm ảnh ${n+1}/${arr.length}…`);const thumbUrl=await makeThumb(arr[n]);items.push({file:arr[n],thumbUrl,correction:null})}render();setStatus(`Đã chọn ${items.length} ảnh.`)}finally{busy=false;sync()}}
function render(){list.replaceChildren();items.forEach((it,idx)=>{const d=document.createElement('div');d.className='item';d.tabIndex=0;const im=document.createElement('img');im.className='thumb';im.src=it.thumbUrl;im.alt='';const nm=document.createElement('div');nm.className='name';nm.textContent=it.file.name;const x=document.createElement('button');x.className='x';x.textContent='×';x.title='Xóa ảnh';x.onclick=e=>{e.stopPropagation();revokeItem(it);items.splice(idx,1);render();setStatus(items.length?`Còn ${items.length} ảnh.`:'')};d.append(im,nm,x);if(it.correction){const ok=document.createElement('div');ok.className='ok';ok.textContent='✓';d.append(ok)}d.onclick=()=>openEditor(idx);d.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openEditor(idx)}};list.append(d)});sync()}
choose.onclick=()=>input.click();input.onchange=()=>{addFiles(input.files);input.value=''};['dragenter','dragover'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>addFiles(e.dataTransfer.files));
function order(p){const pts=p.map(q=>({...q}));const cx=pts.reduce((s,q)=>s+q.x,0)/4,cy=pts.reduce((s,q)=>s+q.y,0)/4;pts.sort((a,b)=>Math.atan2(a.y-cy,a.x-cx)-Math.atan2(b.y-cy,b.x-cx));let k=0;for(let i=1;i<4;i++)if(pts[i].x+pts[i].y<pts[k].x+pts[k].y)k=i;const o=pts.slice(k).concat(pts.slice(0,k));let area=0;for(let i=0;i<4;i++){const a=o[i],b=o[(i+1)%4];area+=a.x*b.y-b.x*a.y}return area<0?[o[0],o[3],o[2],o[1]]:o}

async function bitmapPreview(file,max=1400){if('createImageBitmap'in window){const b=await createImageBitmap(file);const s=Math.min(1,max/Math.max(b.width,b.height));if(s===1)return b;const c=document.createElement('canvas');c.width=Math.round(b.width*s);c.height=Math.round(b.height*s);c.getContext('2d').drawImage(b,0,0,c.width,c.height);b.close();return await createImageBitmap(c)}return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image;im.onload=()=>{URL.revokeObjectURL(u);const s=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*s);c.height=Math.round(im.naturalHeight*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c)};im.onerror=rej;im.src=u})}

function syncTextModeBtn(){if(!textModeBtn)return;textModeBtn.classList.toggle('active',!!ed.previewText)}

let previewTimer=0;function queuePreview(){clearTimeout(previewTimer);previewTimer=setTimeout(()=>drawPreview(false),50)}
function resetPreviewView(){if(!pv.source)return;const r=previewWrap.getBoundingClientRect();previewCanvas.width=Math.max(260,Math.floor(r.width));previewCanvas.height=Math.max(220,Math.floor(r.height));pv.fit=Math.min(previewCanvas.width/pv.source.width,previewCanvas.height/pv.source.height);pv.zoom=1;pv.panX=(previewCanvas.width-pv.source.width*pv.fit)/2;pv.panY=(previewCanvas.height-pv.source.height*pv.fit)/2;drawPreviewViewport()}

function drawPreview(resetView=false){if(!valid(ed.points,ed.sourceW,ed.sourceH)){pv.source=null;previewCanvas.width=360;previewCanvas.height=240;pctx.fillStyle='#fff';pctx.fillRect(0,0,360,240);return}try{const src=document.createElement('canvas');src.width=ed.sourceW;src.height=ed.sourceH;src.getContext('2d').drawImage(ed.bitmap,0,0);const c=warp(src,ed.points,900),t=applyCleanToCanvas(c,ed.clean),s=applyClarityToCanvas(t,ed.clarity),r=applyAutoTextRecovery(s,ed.clarity),v=ed.previewText?applyTextModeToCanvas(r):r;pv.source=v;if(resetView||!previewCanvas.width||!previewCanvas.height)resetPreviewView();else{const r=previewWrap.getBoundingClientRect(),nw=Math.max(260,Math.floor(r.width)),nh=Math.max(220,Math.floor(r.height));if(previewCanvas.width!==nw||previewCanvas.height!==nh){previewCanvas.width=nw;previewCanvas.height=nh;pv.fit=Math.min(nw/v.width,nh/v.height);pv.zoom=1;pv.panX=(nw-v.width*pv.fit)/2;pv.panY=(nh-v.height*pv.fit)/2}else{const oldFit=pv.fit;pv.fit=Math.min(previewCanvas.width/v.width,previewCanvas.height/v.height);if(!isFinite(oldFit)||oldFit<=0){pv.zoom=1;pv.panX=(previewCanvas.width-v.width*pv.fit)/2;pv.panY=(previewCanvas.height-v.height*pv.fit)/2}clampPreviewPan()}drawPreviewViewport()}state.textContent=''}catch(err){state.textContent=err.message}}
function previewPt(e){const r=previewCanvas.getBoundingClientRect();return{x:(e.clientX-r.left)*previewCanvas.width/r.width,y:(e.clientY-r.top)*previewCanvas.height/r.height}}
previewCanvas.onpointerdown=e=>{if(!pv.source)return;pv.pid=e.pointerId;const q=previewPt(e);pv.start={x:q.x,y:q.y,panX:pv.panX,panY:pv.panY};pv.panning=true;previewWrap.classList.add('pan');previewCanvas.setPointerCapture?.(e.pointerId);e.preventDefault()};

function endPreviewPan(e){if(pv.pid!==e.pointerId)return;pv.panning=false;pv.pid=null;previewWrap.classList.remove('pan')};previewCanvas.onpointerup=endPreviewPan;previewCanvas.onpointercancel=endPreviewPan;

function canvasPt(e){const r=editorCanvas.getBoundingClientRect();return{x:(e.clientX-r.left)*editorCanvas.width/r.width,y:(e.clientY-r.top)*editorCanvas.height/r.height}}
function nearest(q){let bi=-1,bd=18;ed.points.forEach((p,i)=>{const m=map(p),d=Math.hypot(m.x-q.x,m.y-q.y);if(d<bd){bd=d;bi=i}});return bi}
editorCanvas.onpointerdown=e=>{const q=canvasPt(e),n=nearest(q);ed.pid=e.pointerId;ed.start={q,panX:ed.panX,panY:ed.panY};if(n>=0){ed.mode='point';ed.drag=n;editorWrap.classList.add('point')}else{ed.mode='pending'};editorCanvas.setPointerCapture?.(e.pointerId);e.preventDefault()};
editorCanvas.onpointermove=e=>{if(ed.pid!==e.pointerId||!ed.mode)return;const q=canvasPt(e);if(ed.mode==='point'){ed.points[ed.drag]=unmap(q);drawEditor();queuePreview();return}const d=Math.hypot(q.x-ed.start.q.x,q.y-ed.start.q.y);if(d>4)ed.mode='pan';if(ed.mode==='pan'){ed.panX=ed.start.panX+q.x-ed.start.q.x;ed.panY=ed.start.panY+q.y-ed.start.q.y;editorWrap.classList.add('pan');drawEditor()}};
function endPtr(e){if(ed.pid!==e.pointerId)return;const q=canvasPt(e);if(ed.mode==='pending'&&ed.points.length<4){ed.points.push(unmap(q));drawEditor();queuePreview()}ed.mode='';ed.drag=-1;ed.pid=null;editorWrap.classList.remove('pan','point')};editorCanvas.onpointerup=endPtr;editorCanvas.onpointercancel=endPtr;

async function openEditor(idx){if(busy)return;busy=true;sync();try{setStatus('Đang mở ảnh…');const bmp=await bitmapPreview(items[idx].file,1400);ed.index=idx;ed.bitmap=bmp;ed.sourceW=bmp.width;ed.sourceH=bmp.height;ed.points=items[idx].correction?items[idx].correction.corners.map(p=>({x:p.x*ed.sourceW,y:p.y*ed.sourceH})):[{x:ed.sourceW*.03,y:ed.sourceH*.03},{x:ed.sourceW*.97,y:ed.sourceH*.03},{x:ed.sourceW*.97,y:ed.sourceH*.97},{x:ed.sourceW*.03,y:ed.sourceH*.97}];ed.clean=items[idx].correction?.clean??items[idx].correction?.white??0;ed.clarity=items[idx].correction?.clarity??Math.max(items[idx].correction?.black||0,items[idx].correction?.sharp||0);ed.previewText=!!items[idx].correction?.textMode;syncTextModeBtn();cleanRange.value=String(ed.clean);cleanVal.textContent=ed.clean+'%';clarityRange.value=String(ed.clarity);clarityVal.textContent=ed.clarity+'%';previewCanvas.style.filter='none';modal.hidden=false;requestAnimationFrame(()=>{resetView();drawPreview(true)});setStatus('')}catch(err){setStatus('Không mở được ảnh: '+err.message,true)}finally{busy=false;sync()}}
function closeEditor(){modal.hidden=true;if(ed.bitmap?.close)ed.bitmap.close();ed.bitmap=null;ed.index=-1;pv.source=null;pv.zoom=1;pv.panX=pv.panY=0}closeBtn.onclick=closeEditor;
autoBtn.onclick=()=>{if(!ed.bitmap)return;const w=ed.sourceW,h=ed.sourceH;ed.points=[{x:w*.025,y:h*.025},{x:w*.975,y:h*.025},{x:w*.975,y:h*.975},{x:w*.025,y:h*.975}];drawEditor();queuePreview();state.textContent='Auto đã đặt 4 góc gần mép ảnh. Có thể kéo lại nếu cần.'};textModeBtn.onclick=()=>{ed.previewText=!ed.previewText;syncTextModeBtn();queuePreview()};cleanRange.oninput=()=>{ed.clean=Number(cleanRange.value)||0;cleanVal.textContent=ed.clean+'%';queuePreview()};clarityRange.oninput=()=>{ed.clarity=Number(clarityRange.value)||0;clarityVal.textContent=ed.clarity+'%';queuePreview()};
saveBtn.onclick=()=>{if(ed.index<0||!valid(ed.points,ed.sourceW,ed.sourceH))return state.textContent='4 góc chưa hợp lệ.';items[ed.index].correction={corners:order(ed.points).map(p=>({x:p.x/ed.sourceW,y:p.y/ed.sourceH})),clean:ed.clean,clarity:ed.clarity,textMode:!!ed.previewText};render();closeEditor();setStatus('Đã lưu cân chỉnh ảnh.')};
async function decodeForExport(file,max=3200){if('createImageBitmap'in window){const b=await createImageBitmap(file);const s=Math.min(1,max/Math.max(b.width,b.height));const c=document.createElement('canvas');c.width=Math.round(b.width*s);c.height=Math.round(b.height*s);c.getContext('2d',{alpha:false}).drawImage(b,0,0,c.width,c.height);b.close();return c}return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image;im.onload=()=>{URL.revokeObjectURL(u);const s=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*s);c.height=Math.round(im.naturalHeight*s);c.getContext('2d',{alpha:false}).drawImage(im,0,0,c.width,c.height);res(c)};im.onerror=rej;im.src=u})}
async function jpegFor(item){let c=await decodeForExport(item.file,3200);if(item.correction){const pts=item.correction.corners.map(p=>({x:p.x*c.width,y:p.y*c.height}));c=warp(c,pts,3000);const clean=item.correction.clean??item.correction.white??0;const clarity=item.correction.clarity??Math.max(item.correction.black||0,item.correction.sharp||0);if(clean>0)c=applyCleanToCanvas(c,clean);if(clarity>0){c=applyClarityToCanvas(c,clarity);c=applyAutoTextRecovery(c,clarity)}if(item.correction.textMode)c=applyTextModeToCanvas(c)}const blob=await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(Error('Không chuyển được ảnh')),'image/jpeg',.94));return{bytes:new Uint8Array(await blob.arrayBuffer()),w:c.width,h:c.height,corrected:!!item.correction}}
const CK={P:'gpp_pdf_standalone_p',G:'gpp_pdf_standalone_g'};function nextName(t){let n=0;try{n=Number(localStorage.getItem(CK[t])||0)}catch(_){}n++;try{localStorage.setItem(CK[t],String(n))}catch(_){}return`GPP-${t}${n}.pdf`}
async function build(arr){const pdf=await PDFLib.PDFDocument.create(),A4=[595.28,841.89],m=Number(margin.value)||0;for(let i=0;i<arr.length;i++){setStatus(`Đang xử lý ${i+1}/${arr.length}: ${arr[i].file.name}`);const j=await jpegFor(arr[i]),em=await pdf.embedJpg(j.bytes);let pw,ph;if(j.corrected||pageSize.value==='image'){pw=Math.max(72,j.w*.75);ph=Math.max(72,j.h*.75)}else{[pw,ph]=j.w>j.h?[A4[1],A4[0]]:A4}const p=pdf.addPage([pw,ph]);if(j.corrected){p.drawImage(em,{x:0,y:0,width:pw,height:ph})}else{const aw=pw-2*m,ah=ph-2*m,s=Math.min(aw/j.w,ah/j.h),dw=j.w*s,dh=j.h*s;p.drawImage(em,{x:(pw-dw)/2,y:(ph-dh)/2,width:dw,height:dh})}}return pdf.save({useObjectStreams:true})}

single.onclick=async()=>{if(busy||!items.length)return;busy=true;sync();try{for(let i=0;i<items.length;i++)download(await build([items[i]]),nextName('P'));setStatus(`Đã xuất ${items.length} PDF riêng.`)}catch(e){setStatus(e.message,true)}finally{busy=false;sync()}};

})();
